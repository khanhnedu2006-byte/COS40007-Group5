services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPEEDMAP_MODE: ${SPEEDMAP_MODE:-actual}
      SPEEDMAP_MODEL_NAME: ${SPEEDMAP_MODEL_NAME:-regional}
      SPEEDMAP_MODEL_RUN: ${SPEEDMAP_MODEL_RUN:-}
    volumes:
      - ./data/interim:/app/data/interim:ro
      - ./data/processed:/app/data/processed:ro
      - ./artifacts/models:/app/artifacts/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/api/health'))['ready']"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

  # Opt in explicitly with --profile online. Normal startup stays on loopback.
  public-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [online]
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    depends_on:
      frontend:
        condition: service_healthy
    restart: "no"
