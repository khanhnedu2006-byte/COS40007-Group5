[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speedmap"
version = "0.1.0"
description = "Mobile internet speed prediction for Hanoi (COS40007)"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.156.8",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
    "scikit-learn>=1.7.2",
    "scikit-learn-intelex>=2026.2.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
speedmap-launch = "speedmap.cli.launch:main"
speedmap-pipeline = "speedmap.cli.run_pipeline:main"
speedmap-train-baselines = "speedmap.cli.train_baselines:main"
speedmap-train-knn = "speedmap.cli.train_knn:main"
speedmap-train-random-forest = "speedmap.cli.train_random_forest:main"
speedmap-train-xgboost-only = "speedmap.cli.train_xgboost_only:main"
speedmap-train-hybrid = "speedmap.cli.train_hybrid:main"
speedmap-train-physics-only = "speedmap.cli.train_physics_only:main"
speedmap-fetch-ookla = "speedmap.cli.fetch_ookla_hanoi:main"
speedmap-fetch-context = "speedmap.cli.fetch_context_data:main"
speedmap-fetch-osm-towers = "speedmap.cli.fetch_osm_towers:main"
speedmap-fetch-places = "speedmap.cli.fetch_places:main"
speedmap-sync-ci-data = "speedmap.cli.sync_ci_data:main"
speedmap-group-task-model = "speedmap.cli.group_task_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
