name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API and shared interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: python -m ruff check backend src/speedmap/inference scripts/launch.py tests/test_api.py tests/test_predictor.py tests/test_launcher.py
      - run: python -m pytest tests/test_api.py tests/test_predictor.py tests/test_launcher.py tests/test_boundary.py tests/test_features.py tests/test_artifacts.py -q
      - name: Check notebook outputs
        shell: python
        run: |
          import json
          from pathlib import Path
          dirty = [str(path) for path in Path('notebooks').glob('*.ipynb')
                   if any(cell.get('outputs') or cell.get('execution_count') is not None
                          for cell in json.loads(path.read_text(encoding='utf-8'))['cells'])]
          assert not dirty, f'Clear notebook outputs before committing: {dirty}'

  frontend:
    name: Web build and browser flows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: pip install -r ../requirements-app.txt
      - run: pip install -e .. --no-deps
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  containers:
    name: Local Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Verify frontend and proxied API
        run: |
          curl --fail http://127.0.0.1:8080/
          curl --fail 'http://127.0.0.1:8080/api/predict?lat=21.0285&lon=105.8542'
      - run: docker compose logs
        if: failure()
      - run: docker compose down
        if: always()
